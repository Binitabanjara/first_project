<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product - AgriDirect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Add New Product</h2>
        <form>
            <label>Product Name</label>
            <input type="text" placeholder="e.g. Organic Tomatoes">
            
            <label>Price (per kg)</label>
            <input type="number" placeholder="e.g. 50">
            
            <label>Available Quantity (kg)</label>
            <input type="number" placeholder="e.g. 100">
            
            <button type="submit" class="btn farmer-bg">List Product</button>
        </form>
        <br>
        <a href="farmer-dashboard.html">Back to Dashboard</a>
    </div>
</body>
</html>
