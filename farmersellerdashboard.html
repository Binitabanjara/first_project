<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriDirect - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-banner">
        <h1>🌱 AgriDirect</h1>
        <p>Connecting Farmers Directly to You</p>
    </header>

    <main class="container">
        <h2>Welcome! Please select your portal:</h2>
        
        <div class="button-grid">
            <div class="card">
                <h3>Farmers</h3>
                <p>Sell your fresh crops</p>
               <a href="farmerlogin.html" class="btn farmer-bg">Farmer Login</a>
            </div>

            <div class="card">
                <h3>Buyers</h3>
                <p>Buy fresh produce</p>
                <a href="#" class="btn buyer-bg">Buyer Login</a>
            </div>

            <div class="card">
                <h3>Staff</h3>
                <p>Manage the platform</p>
                <a href="#" class="btn admin-bg">Admin Login</a>
            </div>
        </div>
    </main>

    <footer class="info-section">
        <p>Direct Trade • Fair Pricing • Small 2% Commission</p>
    </footer>

</body>
</html>
