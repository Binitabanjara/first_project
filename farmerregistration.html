<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Create Farmer Account</h2>
        <form action="farmer-login.html">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
            
            <label>Farm Name</label>
            <input type="text" placeholder="e.g. Green Valley Farms">

            <label>Phone Number</label>
            <input type="tel" placeholder="For buyers to contact you">

            <label>Create Password</label>
            <input type="password" required>

            <button type="submit" class="btn farmer-bg">Register Now</button>
        </form>
        <p>Already have an account? <a href="farmer-login.html">Login</a></p>
    </div>
</body>
</html>
