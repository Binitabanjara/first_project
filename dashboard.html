<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TogetherSpace | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Welcome to TogetherSpace 💞</h2>
        <button onclick="logout()">Logout</button>
    </header>

    <div class="container">

        <!-- Your Update -->
        <div class="box">
            <h3>Your Daily Update</h3>

            <select id="mood">
                <option>😊 Happy</option>
                <option>😐 Okay</option>
                <option>😔 Sad</option>
                <option>❤️ Loved</option>
            </select>

            <textarea id="message" placeholder="How was your day?"></textarea>
            <button onclick="saveUpdate()">Save Update</button>
        </div>

        <!-- Partner Update -->
        <div class="box">
            <h3>Your Partner's Update</h3>
            <div id="partnerUpdate">
                <p><em>No update yet...</em></p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
