<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-banner">
        <h1>Recent Orders</h1>
        <p>Manage your incoming sales</p>
    </header>

    <div class="container" style="max-width: 800px; margin: auto;">
        <table style="width: 100%; border-collapse: collapse; background: white; margin-top: 20px;">
            <tr style="background: var(--primary-green); color: white;">
                <th style="padding: 15px;">Product</th>
                <th>Buyer</th>
                <th>Quantity</th>
                <th>Total Price</th>
                <th>Status</th>
            </tr>
            <tr style="border-bottom: 1px solid #ddd; text-align: center;">
                <td style="padding: 15px;">Organic Tomatoes</td>
                <td>John Doe</td>
                <td>10 kg</td>
                <td>$50</td>
                <td style="color: orange; font-weight: bold;">Pending</td>
            </tr>
        </table>
        <br>
        <a href="farmer-dashboard.html" class="btn admin-bg">Back to Dashboard</a>
    </div>
</body>
</html>
